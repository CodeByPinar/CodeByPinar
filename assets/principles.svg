<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="principles"><defs><clipPath id="p0"><rect width="389.3333333333333" height="190" rx="22"/></clipPath><clipPath id="p1"><rect width="389.3333333333333" height="190" rx="22"/></clipPath><clipPath id="p2"><rect width="389.3333333333333" height="190" rx="22"/></clipPath><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter><filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a9b4f5"/><stop offset=".5" stop-color="#e7a9c8"/><stop offset="1" stop-color="#f1b9a1"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171d2e"/><stop offset="1" stop-color="#131826"/></linearGradient><clipPath id="c"><rect width="1200" height="190" rx="24"/></clipPath></defs><g transform="translate(0.0 0)"><g clip-path="url(#p0)"><rect width="389.3333333333333" height="190" fill="url(#card)"/><circle cx="369.3333333333333" cy="10" r="80" fill="#a9b4f5" opacity="0.26" filter="url(#blur2)"></circle></g><rect x=".5" y=".5" width="388.3333333333333" height="189" rx="21.5" fill="none" stroke="#222a3d"/><circle cx="52" cy="48" r="22" fill="#a9b4f5" fill-opacity=".13"/><g transform="translate(40 36)" fill="none" stroke="#a9b4f5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 7.8-7.5 9.5-4.3-1.7-7.5-5-7.5-9.5V6z"/><path d="M8.8 12l2.2 2.2 4.2-4.4"/></g><text x="88" y="55" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#ebe9f4" font-weight="600" text-anchor="start" >Attacker-aware</text><text x="28" y="112" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#b7bdd0" font-weight="400" text-anchor="start" >I design with the attacker's view in mind: least</text><text x="28" y="134" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#b7bdd0" font-weight="400" text-anchor="start" >privilege, no secrets in output, nothing magic in</text><text x="28" y="156" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#b7bdd0" font-weight="400" text-anchor="start" >production.</text></g><g transform="translate(405.3333333333333 0)"><g clip-path="url(#p1)"><rect width="389.3333333333333" height="190" fill="url(#card)"/><circle cx="369.3333333333333" cy="10" r="80" fill="#86d3c1" opacity="0.26" filter="url(#blur2)"></circle></g><rect x=".5" y=".5" width="388.3333333333333" height="189" rx="21.5" fill="none" stroke="#222a3d"/><circle cx="52" cy="48" r="22" fill="#86d3c1" fill-opacity=".13"/><g transform="translate(40 36)" fill="none" stroke="#86d3c1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g><text x="88" y="55" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#ebe9f4" font-weight="600" text-anchor="start" >Read-only by default</text><text x="28" y="112" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#b7bdd0" font-weight="400" text-anchor="start" >Scanners and reports look, never touch. Writes are</text><text x="28" y="134" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#b7bdd0" font-weight="400" text-anchor="start" >explicit, backed up and reversible.</text></g><g transform="translate(810.6666666666666 0)"><g clip-path="url(#p2)"><rect width="389.3333333333333" height="190" fill="url(#card)"/><circle cx="369.3333333333333" cy="10" r="80" fill="#f1b9a1" opacity="0.26" filter="url(#blur2)"></circle></g><rect x=".5" y=".5" width="388.3333333333333" height="189" rx="21.5" fill="none" stroke="#222a3d"/><circle cx="52" cy="48" r="22" fill="#f1b9a1" fill-opacity=".13"/><g transform="translate(40 36)" fill="none" stroke="#f1b9a1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.3l2.5 2.5 4.6-5"/></g><text x="88" y="55" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#ebe9f4" font-weight="600" text-anchor="start" >Documented &amp; tested</text><text x="28" y="112" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#b7bdd0" font-weight="400" text-anchor="start" >Every plugin ships with tests, TR/EN docs and a</text><text x="28" y="134" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#b7bdd0" font-weight="400" text-anchor="start" >changelog, so it survives its author.</text></g></svg>